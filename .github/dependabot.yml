version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Resolve on the oldest CI interpreter so lock updates stay installable
    # on Python 3.10 through 3.13.
    python-version: "3.10"
    groups:
      python-dependencies:
        patterns:
          - "*"
