version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Dependabot rejects a python-version key in this file. It reads
    # `.python-version` (3.10) so lock updates stay installable on 3.10–3.13.
    groups:
      python-dependencies:
        patterns:
          - "*"
