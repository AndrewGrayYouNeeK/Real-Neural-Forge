name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        ruff check src/ tests/ workers_ci/

    - name: Check formatting with ruff
      run: |
        ruff format --check src/ tests/ workers_ci/

    - name: Type check with mypy
      run: |
        mypy src/ workers_ci/ --ignore-missing-imports --python-version 3.12

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          sudo mv ./actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint -color

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      run: |
        docker build -t neural-forge:test .

    - name: Test Docker image
      run: |
        set -eu
        docker run --rm neural-forge:test python -c "import src.model; import src.api; import src.train; print('Import test passed')"
        cleanup() { docker rm -f forge-events >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        docker run -d --name forge-events -e NEURAL_FORGE_SPACE_REFRESH=0 neural-forge:test
        ready=0
        for attempt in $(seq 1 60); do
          if docker exec forge-events python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$ready" != 1 ]; then
          docker logs forge-events || true
          echo "API did not become healthy after ${attempt} attempts" >&2
          exit 1
        fi
        if ! docker exec forge-events python -m scripts.check_image_events; then
          docker logs forge-events || true
          exit 1
        fi
