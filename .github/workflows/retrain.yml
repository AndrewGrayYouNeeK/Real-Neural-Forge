name: Retrain champions

# Weekly retrain, plus a manual run. Each enabled config under config/ is
# fetched, trained, and promoted only when it beats the champion and the
# baselines. Checkpoints and forecast JSON live on the rolling "champions"
# GitHub Release, not in git. The job cap and the epoch cap keep a private
# repo inside the free Actions minute allowance.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      datasets:
        description: "all, or a comma-separated list of dataset ids or config paths"
        default: "all"
        required: false
        type: string
      max_epochs:
        description: "Maximum epochs per dataset (the config value is used when smaller)"
        default: "8"
        required: false
        type: string
      dry_run:
        description: "List datasets and fetch steps without training or publishing"
        default: "false"
        required: false
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: retrain-champions
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_epochs || '8' }}
      DATASETS: ${{ github.event_name == 'workflow_dispatch' && inputs.datasets || 'all' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain and publish champions
        run: |
          set -euo pipefail
          cmd=(
            python -m src.retrain
            --max-epochs "$MAX_EPOCHS"
            --dataset-timeout 600
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            cmd+=(--dry-run)
          else
            cmd+=(--release-dir release-assets --pull-release --publish)
          fi
          if [[ "$DATASETS" == "all" ]]; then
            cmd+=(--all)
          else
            cmd+=(--datasets "$DATASETS")
          fi
          "${cmd[@]}"

      - name: Upload forecast summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-forecasts
          path: |
            forecasts/**
            release-assets/forecast-*.json
            release-assets/forecasts-index.json
            release-assets/metrics-history.json
          if-no-files-found: warn
          retention-days: 90
