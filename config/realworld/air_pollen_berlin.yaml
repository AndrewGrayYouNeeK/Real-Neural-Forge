# Left out of weekly retraining: holdout MAE lost to persistence.
retrain:
  enabled: false

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 512
data:
  source: csv
  path: data/realworld/air_pollen_berlin.csv
  feature_columns:
  - value
  target_column: value
  seq_len: 90
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0
  seasonal_period: 365
training:
  experiment_name: air_pollen_berlin
  batch_size: 32
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  device: cpu
  seed: 0
  checkpoint_dir: checkpoints/realworld/air_pollen_berlin
  log_interval: 5
storage:
  db_path: data/realworld/experiments.db
realworld:
  id: air_pollen_berlin
  title: Berlin daily pollen index
  units: "grains/m\xB3"
  licence: CC BY 4.0 (Open-Meteo; CAMS/Copernicus attribution)
  source: https://air-quality-api.open-meteo.com/v1/air-quality
