# Opted out of scheduled retraining. The CSVs are local downloads,
# and several of them are too large for the weekly champion job.
retrain:
  enabled: false

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 512
data:
  source: csv
  path: data/realworld/earthquakes_m45_daily.csv
  feature_columns:
  - value
  target_column: value
  seq_len: 60
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0
  seasonal_period: 365
training:
  experiment_name: earthquakes_m45
  batch_size: 64
  learning_rate: 0.001
  epochs: 12
  patience: 4
  max_grad_norm: 1.0
  device: cpu
  seed: 0
  checkpoint_dir: checkpoints/realworld/earthquakes_m45
  log_interval: 5
storage:
  db_path: data/realworld/experiments.db
realworld:
  id: earthquakes_m45
  title: Global daily M4.5+ earthquake count
  units: events/day
  licence: Public domain (U.S. Geological Survey)
  source: https://earthquake.usgs.gov/fdsnws/event/1/
