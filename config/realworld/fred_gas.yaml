model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 512
data:
  source: csv
  path: data/realworld/fred_gas.csv
  feature_columns:
  - value
  target_column: value
  seq_len: 52
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0
  seasonal_period: 52
training:
  experiment_name: fred_gas
  batch_size: 32
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  device: cpu
  seed: 0
  checkpoint_dir: checkpoints/realworld/fred_gas
  log_interval: 5
storage:
  db_path: data/realworld/experiments.db
realworld:
  id: fred_gas
  title: US regular gasoline price
  units: USD/gallon
  licence: Public domain (EIA), distributed by FRED
  source: https://fred.stlouisfed.org/graph/fredgraph.csv?id=GASREGW
