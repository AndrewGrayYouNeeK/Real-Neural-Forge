# Opted out of scheduled retraining. The CSVs are local downloads,
# and several of them are too large for the weekly champion job.
retrain:
  enabled: false

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 512
data:
  source: csv
  path: examples/realworld/website_visits.csv
  feature_columns:
  - value
  target_column: value
  seq_len: 28
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0
  seasonal_period: 7
training:
  experiment_name: website_visits
  batch_size: 32
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  device: cpu
  seed: 0
  checkpoint_dir: checkpoints/realworld/website_visits
  log_interval: 5
storage:
  db_path: data/realworld/experiments.db
realworld:
  id: website_visits
  title: Example daily website visits
  units: visits/day
  licence: Synthetic example in this repository, not a real site
  source: examples/realworld/website_visits.csv
