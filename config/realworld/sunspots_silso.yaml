model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 512
data:
  source: csv
  path: data/realworld/sunspots_monthly.csv
  feature_columns:
  - value
  target_column: value
  seq_len: 132
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0
  seasonal_period: 132
training:
  experiment_name: sunspots_silso
  batch_size: 32
  learning_rate: 0.001
  epochs: 15
  patience: 4
  max_grad_norm: 1.0
  device: cpu
  seed: 0
  checkpoint_dir: checkpoints/realworld/sunspots_silso
  log_interval: 5
storage:
  db_path: data/realworld/experiments.db
realworld:
  id: sunspots_silso
  title: Monthly mean sunspot number
  units: sunspot number
  licence: CC BY-NC 4.0 (WDC-SILSO, Royal Observatory of Belgium)
  source: https://www.sidc.be/SILSO/DATA/SN_m_tot_V2.0.csv
