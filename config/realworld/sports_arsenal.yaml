# Left out of weekly retraining: holdout MAE did not beat the training mean.
retrain:
  enabled: false

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 512
data:
  source: csv
  path: data/realworld/sports_arsenal_goal_diff.csv
  feature_columns:
  - value
  target_column: value
  seq_len: 10
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0
  seasonal_period: 38
training:
  experiment_name: sports_arsenal
  batch_size: 32
  learning_rate: 0.001
  epochs: 25
  patience: 6
  max_grad_norm: 1.0
  device: cpu
  seed: 0
  checkpoint_dir: checkpoints/realworld/sports_arsenal
  log_interval: 5
storage:
  db_path: data/realworld/experiments.db
realworld:
  id: sports_arsenal
  title: Arsenal match goal difference
  units: goals
  licence: Free CSV from football-data.co.uk; no SPDX licence. Credit the site.
  source: https://www.football-data.co.uk/
