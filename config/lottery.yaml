# Sanity check: predict the next Powerball number (1-26) from past draws.
# Draws are independent, so exact-match accuracy should sit on 1/26.
# Fetch the CSV first: python scripts/fetch_powerball.py
# The CSV lives under data/ (gitignored). Checkpoints stay under
# checkpoints/lottery/ and do not replace checkpoints/best_model.pt.

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 128

data:
  source: csv
  path: data/powerball.csv
  feature_columns: ["powerball"]
  target_column: powerball
  seq_len: 32
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0

training:
  experiment_name: lottery-powerball
  batch_size: 64
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/lottery
  log_interval: 5
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/lottery/best_model.pt

api:
  training_enabled: true

storage:
  db_path: data/lottery_experiments.db
