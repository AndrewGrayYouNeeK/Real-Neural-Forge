# Next-day maximum temperature at New York Central Park (NOAA GHCNd:USW00094728).
# Public-domain U.S. government work (17 U.S.C. § 105). Fetch the CSV first:
#   python -m scripts.fetch_weather
#
# Decision recipe. Validation labels run from 2009-10-31 through 2017-01-06.
# Training does not score 2017-01-07 through 2025-12-31. That held-out number
# comes from one refit: config/weather_refit.yaml, then
#   python -m src.evaluation.holdout --config config/weather_refit.yaml --split test

model:
  name: time_series_transformer
  # Eight weather/calendar columns, plus missingness indicators for snwd_mm
  # and awnd_ms. Those two are the columns with gaps before the validation start.
  input_dim: 10
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 512
  patch_len: 1
  use_revin: false
  residual: true
  target_index: 0

data:
  source: csv
  path: data/weather_central_park.csv
  date_column: date
  feature_columns:
    - temperature_c
    - tmin_c
    - prcp_mm
    - snow_mm
    - snwd_mm
    - awnd_ms
    - doy_sin
    - doy_cos
  target_column: temperature_c
  # Indicators and median fills are fit on rows before the first validation label.
  missing_indicators: true
  seq_len: 28
  val_split: 0.2
  split_mode: temporal
  split_seed: 0
  val_start: "2009-10-31"
  test_start: "2017-01-07"
  normalize: true
  report_baselines: true
  # Equal weight was fixed before looking at this split. It is not tuned here.
  blend_with: gradient_boosting
  blend_weight: 0.5
  seed: 0

training:
  experiment_name: weather_central_park_tmax
  batch_size: 64
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  weight_decay: 0
  device: cpu
  # Separate from checkpoints/best_model.pt, which the API loads on startup.
  checkpoint_dir: checkpoints/weather
  log_interval: 1
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/weather/best_model.pt

api:
  training_enabled: true

storage:
  db_path: data/weather_experiments.db
