# Equities and the S&P 500. scripts/train_markets.py reads this catalog and
# writes one trainer config per series. Do not pass this file to
# python -m src.train: data.path is only a sentinel until that script fills it.
# dataset.enabled keeps the catalog out of scheduled champion retraining.
dataset:
  enabled: false
retrain:
  enabled: false
group: stocks
description: Large-cap equities and the S&P 500, modelled as daily log returns.

model:
  name: time_series_transformer
  input_dim: 2
  output_dim: 1
  d_model: 16
  nhead: 2
  num_encoder_layers: 1
  dim_feedforward: 32
  dropout: 0.1
  max_seq_len: 64

data:
  source: csv
  path: data/markets/features/_not_a_series.csv
  feature_columns: [log_return, vol_10]
  target_column: log_return
  seq_len: 16
  val_split: 0.2
  split_mode: temporal
  normalize: true

training:
  experiment_name: market-stocks
  batch_size: 256
  learning_rate: 0.001
  epochs: 8
  patience: 3
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/markets
  log_interval: 100
  seed: 0
