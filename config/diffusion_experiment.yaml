# Experimental 1D conditional diffusion forecaster (CPU-small).
# Not the default — compare via python -m src.compare against the transformer.
dataset:
  id: diffusion-experiment
  enabled: false

retrain:
  enabled: false
  metric: mae

model:
  name: diffusion_forecaster
  input_dim: 1
  output_dim: 1
  hidden_size: 32
  diffusion_steps: 20
  sample_steps: 5
  n_paths: 16
  max_seq_len: 128
  dropout: 0.0

data:
  source: synthetic
  n_samples: 256
  seq_len: 32
  noise: 0.05
  val_split: 0.2
  split_seed: 0
  seed: 0

training:
  experiment_name: diffusion-experiment
  batch_size: 32
  learning_rate: 0.001
  epochs: 4
  device: cpu
  checkpoint_dir: checkpoints/diffusion
  log_interval: 1
  seed: 0
  patience: 0

forecast:
  horizon: 1
  strategy: direct
  quantiles: [0.1, 0.5, 0.9]
  nominal_coverage: 0.8

inference:
  device: cpu
  checkpoint_path: checkpoints/diffusion/best_model.pt

api:
  training_enabled: true
