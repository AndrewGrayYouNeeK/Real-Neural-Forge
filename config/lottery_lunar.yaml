# Opt-in Powerball model that also sees the moon on the draw date.
# Weekly retraining stays off. The published comparison is
# results/lunar_lottery_analysis.json, written by
# python -m src.evaluation.lunar_lottery.
# input_dim is the Powerball column plus the 16 lunar model columns
# attached to the day being forecast (future_lunar).

dataset:
  id: lottery_lunar

retrain:
  enabled: false

model:
  name: time_series_transformer
  input_dim: 17
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.0
  max_seq_len: 64

data:
  source: csv
  path: data/powerball.csv
  date_column: draw_date
  feature_columns: ["powerball"]
  target_column: powerball
  future_lunar: true
  lunar_timezone: America/New_York
  lunar_at: "22:59"
  seq_len: 32
  val_split: 0.2
  split_mode: temporal
  normalize: true
  seed: 0

training:
  experiment_name: lottery-powerball-lunar
  batch_size: 64
  learning_rate: 0.001
  epochs: 8
  patience: 3
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/lottery_lunar
  log_interval: 5
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/lottery_lunar/best_model.pt
