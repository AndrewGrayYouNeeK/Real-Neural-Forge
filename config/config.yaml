# dataset.id is the champion and forecast name. Other YAML files under config/
# are picked up automatically; set dataset.enabled: false to skip one.
dataset:
  id: default

# Scheduled retraining promotes a checkpoint only when its validation metric
# is strictly better than the current champion and the baselines.
retrain:
  metric: mae

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 512

data:
  source: synthetic
  n_samples: 1024
  seq_len: 64
  noise: 0.05
  val_split: 0.2
  split_seed: 0
  seed: 0

training:
  experiment_name: default
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  device: cpu
  checkpoint_dir: checkpoints
  log_interval: 10
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/best_model.pt

# training_enabled defaults to true when this section is omitted.
# Set it to false to reject POST /train. A token, when required, comes from
# the NEURAL_FORGE_API_TOKEN environment variable rather than this file.
api:
  training_enabled: true

storage:
  db_path: data/experiments.db

# horizon 1 and strategy direct keep the one-step model and POST /predict response.
# Set quantiles to [0.1, 0.5, 0.9] to train prediction intervals. See config/forecast.yaml.
forecast:
  horizon: 1
  strategy: direct

# Caps for visitor accounts on the shared container. Environment variables
# listed in the README override these numbers.
limits:
  max_dataset_bytes: 2000000
  max_datasets_per_user: 12
  max_config_bytes: 64000
  max_epochs: 5
  max_run_seconds: 90
  max_samples: 512
  max_seq_len: 32
  global_queue_limit: 8
  max_predictions_stored: 30
  max_prediction_points: 512
  max_checkpoint_bytes: 32000000
  max_active_jobs_per_user: 1
  max_batch_size: 32

# GQ voice (ElevenLabs read-aloud). Text on the site is always free; only
# audio playback spends characters. Every account gets free_chars once; the
# paid Nous Plus subscription includes monthly_chars of GQ voice every month,
# and there is nothing else to buy. Environment variables documented in the
# README override these numbers. The ElevenLabs API cost is about $0.08 per
# 1,000 characters, so the allowance costs at most about $3.20 a month against
# a $9.00 subscription.
voice:
  voice_id: QMnwdN2oOwNXPcl9oXIl
  # Second choice in the picker: ElevenLabs premade "Sarah", shown as "Ivy".
  alt_voice_id: EXAVITQu4vr4xnSDxMaL
  alt_voice_name: Ivy
  model_id: eleven_multilingual_v2
  # Crisp and quick, still Andrew: high stability + similarity, no style
  # exaggeration, speaker boost on, 10% faster than the natural drawl.
  stability: 0.75
  similarity_boost: 0.9
  style: 0
  use_speaker_boost: true
  speed: 1.1
  apply_text_normalization: "on"
  free_chars: 5000
  max_chars_per_request: 2000
  daily_char_limit: 300000
  plan:
    name: Nous Plus
    price_usd: 9.0
    monthly_chars: 40000
