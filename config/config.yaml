# dataset.id is the champion and forecast name. Other YAML files under config/
# are picked up automatically; set dataset.enabled: false to skip one.
dataset:
  id: default

# Scheduled retraining promotes a checkpoint only when its validation metric
# is strictly better than the current champion and the baselines.
retrain:
  metric: mae

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 512

data:
  source: synthetic
  n_samples: 1024
  seq_len: 64
  noise: 0.05
  val_split: 0.2
  split_seed: 0
  seed: 0

training:
  experiment_name: default
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  device: cpu
  checkpoint_dir: checkpoints
  log_interval: 10
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/best_model.pt

# training_enabled defaults to true when this section is omitted.
# Set it to false to reject POST /train. A token, when required, comes from
# the NEURAL_FORGE_API_TOKEN environment variable rather than this file.
api:
  training_enabled: true

storage:
  db_path: data/experiments.db

# horizon 1 and strategy direct keep the one-step model and POST /predict response.
# Set quantiles to [0.1, 0.5, 0.9] to train prediction intervals. See config/forecast.yaml.
forecast:
  horizon: 1
  strategy: direct
