model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 512

data:
  source: synthetic
  n_samples: 1024
  seq_len: 64
  noise: 0.05

training:
  experiment_name: default
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  device: cpu
  checkpoint_dir: checkpoints
  log_interval: 10

inference:
  device: cpu
  checkpoint_path: checkpoints/best_model.pt

storage:
  db_path: data/experiments.db
