model:
  input_dim: 1          # number of input features per time step
  output_dim: 1         # number of output values per prediction
  d_model: 64           # transformer embedding dimension
  nhead: 4              # number of attention heads
  num_encoder_layers: 3 # number of transformer encoder layers
  dim_feedforward: 256  # feedforward network dimension
  dropout: 0.1          # dropout probability
  max_seq_len: 512      # maximum sequence length for positional encoding

data:
  csv_path: null        # path to a CSV; null uses the sine-wave fallback
  value_column: null    # column name; auto-detects value/close/price/y
  seq_len: 64
  val_split: 0.2        # last fraction of remaining windows held out in time order
  test_split: 0.1       # final holdout for src.eval; 0 disables
  standardize: true     # fit mean/std on train windows only
  n_samples: 1024       # sine fallback only
  noise: 0.05           # sine fallback only

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  patience: 10          # stop if val_mse does not improve; 0 disables
  max_grad_norm: 1.0    # 0 disables gradient clipping
  seed: 42
  resume: false         # continue from checkpoints/best_model.pt
  scheduler: plateau    # ReduceLROnPlateau, or null
  device: cpu           # set to "cuda" to use GPU
  checkpoint_dir: checkpoints
  log_interval: 10

inference:
  device: cpu           # set to "cuda" to use GPU
  checkpoint_path: checkpoints/best_model.pt
  require_checkpoint: false  # 503 /predict if no trained weights
  max_horizon: 64
