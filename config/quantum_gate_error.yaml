# Research comparison. The domain trainer owns the split, so the weekly
# champion job leaves this file alone.
retrain:
  enabled: false

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 16
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 32
  dropout: 0.05
  max_seq_len: 32

data:
  path: datasets/quantum/two_qubit_error_annual.csv
  date_column: date
  feature_columns: ["log10_error"]
  seq_len: 4
  test_fraction: 0.2
  val_fraction: 0.15
  split_mode: temporal
  normalize: true
  transform: none
  already_log10: true
  seed: 0

training:
  experiment_name: quantum_gate_error
  batch_size: 8
  learning_rate: 0.001
  epochs: 80
  patience: 15
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/quantum_gate_error
  seed: 0

output:
  results: results/quantum_gate_error.json
