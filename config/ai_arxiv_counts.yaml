model:
  name: time_series_transformer
  input_dim: 3
  output_dim: 3
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 64

data:
  path: datasets/ai_progress/arxiv_counts_monthly.csv
  date_column: month
  feature_columns: ["cs.AI", "cs.LG", "cs.CL"]
  seq_len: 12
  test_fraction: 0.2
  val_fraction: 0.1
  split_mode: temporal
  normalize: true
  transform: log1p
  already_log10: false
  seed: 0

training:
  experiment_name: ai_arxiv_counts
  batch_size: 16
  learning_rate: 0.001
  epochs: 40
  patience: 8
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/ai_arxiv_counts
  seed: 0

output:
  results: results/ai_arxiv_counts.json
