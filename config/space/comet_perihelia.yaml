# Weekly retrain. The fetch is cached, so later configs in the same job reuse it.
retrain:
  enabled: true
  metric: mae
  baselines:
    - persistence
    - mean
    - seasonal

model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 512

data:
  source: csv
  path: data/space/comet_perihelia_monthly.csv
  date_column: date
  feature_columns: [perihelia]
  target_column: perihelia
  seq_len: 24
  val_split: 0.2
  split_mode: temporal
  split_seed: 0
  normalize: true
  report_baselines: true
  seed: 0
  season_length: 12
  fetch: python -m scripts.fetch_solar_system
  fetch_timeout_seconds: 600

training:
  experiment_name: space_comet_perihelia
  batch_size: 32
  learning_rate: 0.001
  epochs: 40
  patience: 6
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/space/comet_perihelia
  log_interval: 10
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/space/comet_perihelia/best_model.pt

api:
  training_enabled: true

storage:
  db_path: data/space/experiments.db

dataset:
  id: comet_perihelia

space:
  id: comet_perihelia
  group: solar_system
  title: Comet perihelia known at the time
  units: count
  control: known_at_time
  survey_growth: true
  discovery_column: comet_prev
  lags: [12]
  drift: true
  mean: true
  chart: false
  outlook_months: 24
  outlook_min: 0
