model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 512

data:
  source: csv
  path: data/space/neo_discoveries_monthly.csv
  date_column: date
  feature_columns: [discoveries]
  target_column: discoveries
  seq_len: 24
  val_split: 0.2
  split_mode: temporal
  split_seed: 0
  normalize: true
  report_baselines: true
  seed: 0

training:
  experiment_name: space_neo_discoveries
  batch_size: 32
  learning_rate: 0.001
  epochs: 40
  patience: 6
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/space/neo_discoveries
  log_interval: 10
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/space/neo_discoveries/best_model.pt

api:
  training_enabled: true

storage:
  db_path: data/space/experiments.db

space:
  id: neo_discoveries
  title: NEO first-observation counts per month
  units: count
  lags: []
  storm_threshold: null
  drift: true
  chart: false

retrain:
  enabled: false
