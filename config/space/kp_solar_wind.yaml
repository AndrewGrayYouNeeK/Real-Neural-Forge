model:
  name: time_series_transformer
  input_dim: 3
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 512

data:
  source: csv
  path: data/space/kp_solar_wind.csv
  date_column: date
  feature_columns: [kp_max, speed, density]
  target_column: kp_max
  seq_len: 27
  val_split: 0.2
  split_mode: temporal
  split_seed: 0
  normalize: true
  report_baselines: true
  seed: 0

training:
  experiment_name: space_kp_solar_wind
  batch_size: 64
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/space/kp_solar_wind
  log_interval: 5
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/space/kp_solar_wind/best_model.pt

api:
  training_enabled: true

storage:
  db_path: data/space/experiments.db

space:
  id: kp_solar_wind
  title: Daily maximum Kp with solar-wind features
  units: Kp
  lags: [27, 4018]
  storm_threshold: 5.0
  drift: false
  chart: false

retrain:
  enabled: false
