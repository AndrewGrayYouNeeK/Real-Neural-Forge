model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 512

data:
  source: csv
  path: data/space/solar_wind_daily.csv
  date_column: date
  feature_columns: [speed]
  target_column: speed
  seq_len: 27
  val_split: 0.2
  split_mode: temporal
  split_seed: 0
  normalize: true
  report_baselines: true
  seed: 0

training:
  experiment_name: space_solar_wind_speed
  batch_size: 64
  learning_rate: 0.001
  epochs: 20
  patience: 5
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/space/solar_wind_speed
  log_interval: 5
  seed: 0

inference:
  device: cpu
  checkpoint_path: checkpoints/space/solar_wind_speed/best_model.pt

api:
  training_enabled: true

storage:
  db_path: data/space/experiments.db

space:
  id: solar_wind_speed
  title: Daily solar-wind speed
  units: km/s
  lags: [27, 4018]
  storm_threshold: null
  drift: false
  chart: false

retrain:
  enabled: false
