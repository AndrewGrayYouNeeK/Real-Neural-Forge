model:
  name: time_series_transformer
  input_dim: 1
  output_dim: 1
  d_model: 32
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 64
  dropout: 0.1
  max_seq_len: 64

data:
  path: datasets/quantum/qrng_symbols.csv
  date_column: step
  feature_columns: ["code"]
  seq_len: 16
  test_fraction: 0.2
  val_fraction: 0.1
  split_mode: temporal
  normalize: true
  transform: none
  already_log10: false
  seed: 0

training:
  experiment_name: quantum_random
  batch_size: 64
  learning_rate: 0.001
  epochs: 12
  patience: 3
  max_grad_norm: 1.0
  device: cpu
  checkpoint_dir: checkpoints/quantum_random
  seed: 0

output:
  results: results/quantum_random.json
