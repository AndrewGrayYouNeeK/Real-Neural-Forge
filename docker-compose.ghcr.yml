# Run the image published to GitHub Container Registry.
# docker compose -f docker-compose.ghcr.yml up
services:
  api:
    image: ghcr.io/andrewgrayyouneek/real-neural-forge:latest
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Empty values leave the endpoint open and skip the champion download.
      - NEURAL_FORGE_API_TOKEN=${NEURAL_FORGE_API_TOKEN:-}
      - NEURAL_FORGE_CONFIG=${NEURAL_FORGE_CONFIG:-}
      - NEURAL_FORGE_CHECKPOINT_URL=${NEURAL_FORGE_CHECKPOINT_URL:-}
      - NEURAL_FORGE_CHECKPOINT_TOKEN=${NEURAL_FORGE_CHECKPOINT_TOKEN:-}
    restart: unless-stopped
