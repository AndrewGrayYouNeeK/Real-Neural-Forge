# One-command Fly.io alternative. App names are global; change `app` if it is taken.
# This file does not create or deploy anything until someone runs fly launch.
app = "real-neural-forge"
primary_region = "iad"

[build]
  image = "ghcr.io/andrewgrayyouneek/real-neural-forge:latest"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
