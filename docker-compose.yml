services:
  api:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Uncomment to require this bearer token on POST /train.
      # - NEURAL_FORGE_API_TOKEN=change-me
    restart: unless-stopped
